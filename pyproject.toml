[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "unused-pkg-remover"
version = "1.0.0"
description = "GUI tool to find and remove orphaned Arch Linux packages"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.5",
]
keywords = ["arch-linux", "pacman", "orphan", "package-manager"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
]

[project.scripts]
unused-pkg-remover = "unused_pkg_remover:main"

[tool.setuptools.packages.find]
include = ["unused_pkg_remover*"]
