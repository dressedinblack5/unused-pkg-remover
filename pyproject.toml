[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "unused-pkg-remover"
version = "1.2.4"
description = "GUI tool to find and remove orphaned Arch Linux packages"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.5",
]
keywords = ["arch-linux", "pacman", "orphan", "package-manager", "cleanup"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
dev = ["ruff", "pre-commit", "pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/dressedinblack5/unused-pkg-remover"
Repository = "https://github.com/dressedinblack5/unused-pkg-remover"
"Bug Tracker" = "https://github.com/dressedinblack5/unused-pkg-remover/issues"

[project.scripts]
unused-pkg-remover = "unused_pkg_remover:main"

[tool.setuptools.packages.find]
include = ["unused_pkg_remover*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*.py" = ["SIM117"]
