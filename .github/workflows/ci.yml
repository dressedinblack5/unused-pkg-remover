name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-base-dev libgl1-mesa-dev 2>/dev/null || true
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install ".[dev]" pytest
      - name: Debug info
        shell: bash
        run: |
          set +e
          echo "=== Python ===" && python3 --version
          echo "=== which pytest ===" && which pytest || echo "not found"
          echo "=== pytest --version ===" && pytest --version || echo "not found"
          echo "=== pip list pytest ===" && pip list 2>/dev/null | grep -i pytest || echo "not found in pip"
          echo "=== import unused_pkg_remover ===" && python3 -c "import unused_pkg_remover; print('OK')" 2>&1 || echo "import failed"
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          python -m pytest -v >/tmp/pytest.log 2>&1
          RC=$?
          echo "::error::pytest exit code: $RC"
          head -20 /tmp/pytest.log | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit $RC
