name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-base-dev libgl1-mesa-dev 2>/dev/null || true
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install ".[dev]" pytest
      - name: Debug info
        run: |
          which python && python --version
          which pytest && pytest --version || echo "no pytest binary"
          python -c "import pytest; print('pytest:', pytest.__version__)"
          python -c "import unused_pkg_remover; print('package:', unused_pkg_remover.__file__)"
          pip list 2>/dev/null | grep -i pytest
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v
